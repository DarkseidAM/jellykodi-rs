[package]
name = "jellykodi-rs"
version = "0.2.11"
edition = "2024"
rust-version = "1.100"
description = "Rust sidecar for hybrid Jellyfin ↔ Kodi native library + fast widgets"
license = "MIT"
repository = "https://github.com/DarkseidAM/jellykodi-rs"

[[bin]]
name = "jellykodi-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls", "http2"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
