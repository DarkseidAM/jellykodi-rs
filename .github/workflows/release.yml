name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.100.0"

permissions:
  contents: read

jobs:
  test-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  build-aarch64:
    runs-on: ubuntu-latest
    needs: test-host
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-gnu

      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          rustc --version
          cargo build --release --target aarch64-unknown-linux-gnu
          aarch64-linux-gnu-strip -s target/aarch64-unknown-linux-gnu/release/jellykodi-rs || true

      - name: Package Kodi add-on + repository tree
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*version="\([^"]*\)".*/\1/p' plugin.video.jellykodi/addon.xml | head -1)-dev"
          fi
          STAGE=$(mktemp -d)
          ADDON="$STAGE/plugin.video.jellykodi"
          mkdir -p "$ADDON/bin" "$ADDON/resources/language/resource.language.en_gb"
          cp plugin.video.jellykodi/addon.xml "$ADDON/"
          cp plugin.video.jellykodi/default.py "$ADDON/"
          cp plugin.video.jellykodi/service.py "$ADDON/"
          cp plugin.video.jellykodi/resources/settings.xml "$ADDON/resources/"
          cp plugin.video.jellykodi/resources/language/resource.language.en_gb/strings.po \
            "$ADDON/resources/language/resource.language.en_gb/"
          if [ -f plugin.video.jellykodi/resources/icon.png ]; then
            cp plugin.video.jellykodi/resources/icon.png "$ADDON/resources/"
          fi
          cp target/aarch64-unknown-linux-gnu/release/jellykodi-rs "$ADDON/bin/"
          chmod 755 "$ADDON/bin/jellykodi-rs"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Only bump the root <addon ... version="..."> — never <import version=...>.
            python3 - "$ADDON/addon.xml" "$VERSION" <<'PY'
import re, sys
from pathlib import Path
path, ver = Path(sys.argv[1]), sys.argv[2]
text = path.read_text(encoding="utf-8")
new, n = re.subn(
    r'(<addon\b[^>]*?\bversion=")[^"]+(")',
    rf"\g<1>{ver}\2",
    text,
    count=1,
)
if n != 1:
    raise SystemExit(f"expected 1 root addon version bump, got {n}")
path.write_text(new, encoding="utf-8")
PY
          fi
          ZIP="plugin.video.jellykodi-${VERSION}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/${ZIP}" plugin.video.jellykodi)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          python3 scripts/build-kodi-repo.py --plugin-zip "$ZIP" --out repo-dist
          # Sanity: import deps must keep their own versions
          python3 - "$ZIP" <<'PY'
import sys, zipfile, xml.etree.ElementTree as ET
with zipfile.ZipFile(sys.argv[1]) as zf:
    xml = zf.read("plugin.video.jellykodi/addon.xml")
root = ET.fromstring(xml)
assert root.attrib["version"]
for imp in root.find("requires") or []:
    if imp.attrib.get("addon") == "xbmc.python":
        assert imp.attrib["version"] != root.attrib["version"], imp.attrib
        assert imp.attrib["version"].startswith("3."), imp.attrib
print("addon.xml versions ok:", root.attrib["version"])
PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jellykodi-dist
          path: |
            ${{ env.ZIP }}
            repo-dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            repo-dist/repository.jellykodi-*.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            JellyKodi Hybrid **${{ env.VERSION }}** (aarch64).

            **Auto-updates:** install `repository.jellykodi-1.0.0.zip` once
            (Add-ons → Install from zip), then install/update `plugin.video.jellykodi`
            from **JellyKodi Repository**. Feed:
            https://darkseidam.github.io/jellykodi-rs/

            Or install `plugin.video.jellykodi-${{ env.VERSION }}.zip` directly from this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-aarch64
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: jellykodi-dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo-dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
