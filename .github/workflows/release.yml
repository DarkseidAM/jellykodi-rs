name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.100.0"

permissions:
  contents: read

jobs:
  # Native aarch64 — CoreELEC target. Avoids cross-compile + linker setup.
  test-and-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release (native aarch64)
        run: |
          uname -m
          rustc --version
          cargo build --release
          strip -s target/release/jellykodi-rs || true
          file target/release/jellykodi-rs

      - name: Package Kodi add-on + repository tree
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*<addon [^>]*version="\([^"]*\)".*/\1/p' plugin.video.jellykodi/addon.xml | head -1)-dev"
          fi
          STAGE=$(mktemp -d)
          ADDON="$STAGE/plugin.video.jellykodi"
          mkdir -p "$ADDON/bin" "$ADDON/resources/language/resource.language.en_gb"
          cp plugin.video.jellykodi/addon.xml "$ADDON/"
          cp plugin.video.jellykodi/default.py "$ADDON/"
          cp plugin.video.jellykodi/service.py "$ADDON/"
          cp plugin.video.jellykodi/context.py "$ADDON/"
          cp plugin.video.jellykodi/resources/settings.xml "$ADDON/resources/"
          cp plugin.video.jellykodi/resources/language/resource.language.en_gb/strings.po \
            "$ADDON/resources/language/resource.language.en_gb/"
          if [ -f plugin.video.jellykodi/resources/icon.png ]; then
            cp plugin.video.jellykodi/resources/icon.png "$ADDON/resources/"
          fi
          cp target/release/jellykodi-rs "$ADDON/bin/"
          chmod 755 "$ADDON/bin/jellykodi-rs"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 scripts/set-addon-root-version.py "$ADDON/addon.xml" "$VERSION"
          fi
          ZIP="plugin.video.jellykodi-${VERSION}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/${ZIP}" plugin.video.jellykodi)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          python3 scripts/build-kodi-repo.py --plugin-zip "$ZIP" --out repo-dist
          python3 scripts/verify-addon-zip.py "$ZIP"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jellykodi-dist
          path: |
            ${{ env.ZIP }}
            repo-dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            repo-dist/repository.jellykodi-*.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            JellyKodi Hybrid **${{ env.VERSION }}** (native aarch64).

            **Auto-updates:** install `repository.jellykodi-1.0.0.zip` once
            (Add-ons → Install from zip), then install/update `plugin.video.jellykodi`
            from **JellyKodi Repository**. Feed:
            https://darkseidam.github.io/jellykodi-rs/

            Or install `plugin.video.jellykodi-${{ env.VERSION }}.zip` directly from this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: jellykodi-dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo-dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
